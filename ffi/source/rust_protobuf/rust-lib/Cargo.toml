[package]
name = "rust_protobuf"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"] # Penting untuk FFI (.so / .dll)

[dependencies]
prost = "0.13"
libc = "0.2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4.3"

[build-dependencies]
prost-build = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort' # Memperkecil ukuran binary
